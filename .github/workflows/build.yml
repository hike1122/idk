name: Build APK
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p www && mv index.html style.css app.js www/
      - run: npm install
      - run: npx cap add android
      - run: |
          sed -i 's#</manifest>#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/><uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/></manifest>#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: jejum-dieta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - run: gh release create v${{ github.run_number }} android/app/build/outputs/apk/debug/app-debug.apk --title "APK v${{ github.run_number }}" --notes "Baixe o app-debug.apk"
        env:
          GH_TOKEN: ${{ github.token }}
